# Cloudflare Tunnel의 Public Hostname bgrc.howmanycals.online이 localhost:18080으로 연결한 뒤 활성화한다.
# WCForge API로 proxy_pass하지 않는, 무료급식 출석 시스템 전용 정적 업데이트 서버다.
server {
    # cloudflared 컨테이너는 host network를 사용한다. 외부에는 열지 않는다.
    listen 127.0.0.1:18080;
    server_name bgrc.howmanycals.online;

    root /srv/bgrc-updates/public;
    autoindex off;
    server_tokens off;

    location = /stable/manifest.json {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location = /stable/manifest.json.sig {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location /releases/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        # 대형 JAR 전송이 WCForge 대역폭을 잠식하지 않게 연결당 제한한다.
        limit_rate 2m;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        return 404;
    }
}
