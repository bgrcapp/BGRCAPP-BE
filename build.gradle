plugins {
    id 'groovy'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bgrc'
version = providers.gradleProperty('releaseVersion').getOrElse('1.2.0')
description = 'attendance'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.poi:poi-ooxml:5.2.3' // 엑셀 처리 핵심 라이브러리
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.apache.poi:poi:5.4.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.apache.groovy:groovy'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    buildInfo()
}

tasks.named('bootJar') {
    archiveFileName = "attendance-${project.version}.jar"
}

tasks.register('prepareWindowsDistribution', Copy) {
    dependsOn tasks.named('bootJar'), ':launcher:prepareDistribution'
    into(layout.buildDirectory.dir('windows-distribution'))

    from('launcher/build/distribution')
    from(tasks.named('bootJar')) {
        into('versions')
    }
}

tasks.register('packageWindowsDistribution', Zip) {
    dependsOn tasks.named('prepareWindowsDistribution')
    archiveFileName = "bgrc-attendance-${project.version}-windows.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('windows-distribution'))
}

tasks.named('processResources') {
    from('data/attendance/무료급식 일일 식사내역_26.8_일지.xlsx') {
        rename { 'attendance-template.xlsx' }
    }
}
