plugins {
    id 'java'
}

import org.apache.tools.ant.filters.ReplaceTokens

group = rootProject.group
version = rootProject.version
def updatePublicKeyBase64 = providers.gradleProperty('updatePublicKeyBase64').orElse('').get().trim()

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
    archiveBaseName = 'attendance-launcher'
    manifest {
        attributes('Main-Class': 'com.bgrc.attendance.launcher.AttendanceLauncher')
    }
}

tasks.register('prepareDistribution', Copy) {
    dependsOn tasks.named('jar')
    doFirst {
        if (updatePublicKeyBase64.isBlank()) {
            throw new GradleException('Windows 배포본에는 -PupdatePublicKeyBase64=<Ed25519 공개키 Base64>가 필요합니다.')
        }
    }
    into(layout.buildDirectory.dir('distribution'))
    from(tasks.named('jar')) {
        rename { 'attendance-launcher.jar' }
        into('launcher')
    }
    from('run-attendance-launcher.bat') {
        into('launcher')
    }
    from('launcher.properties.example') {
        rename { 'launcher.properties' }
        into('config')
        filter(ReplaceTokens, tokens: [
                VERSION          : project.version.toString(),
                UPDATE_PUBLIC_KEY: updatePublicKeyBase64
        ])
    }
}
